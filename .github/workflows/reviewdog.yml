name: Reviewdog

on:
  push:
    branches:
      - "main"
  pull_request:
    types:
      - "opened"
      - "synchronize"

jobs:
  biome:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        env:
          cache-name: bun-cache
        with:
          key: ${{ env.cache-name }}-${{ hashFiles('**/bun.lockb') }}
          path: ~/.bun/install/cache

      - name: Install dependencies
        run: bun install

      - uses: mongolyy/reviewdog-action-biome@aed0b35b89586ed70a61e9749f2edd69c89e16fd # v1
        with:
          reporter: 'github-check'
          fail_on_error: true
          biome_flags: './src *.js *.ts *.json'

  typos:
    name: typos (Spellchecker)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run typos
        uses: Shemnei/reviewdog-action-typos@35d34d657567e18cfb722e89287b380dc65b0bca # v0
        with:
          reporter: 'github-check'
          fail_on_error: true
